<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KBS-Cannonhill · Turnier</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/css/stil.css">
</head>
<body class="beamer">
  <!-- Lobby -->
  <div id="ansicht-lobby" class="beamer-raster">
    <aside class="seitenleiste">
      <section class="karte beitritt">
        <div class="logo">KBS-Cannonhill</div>
        <div id="qr" class="qr"></div>
        <p class="url" id="beitritt-url"></p>
        <div class="code" id="raumcode">····</div>
      </section>
      <section class="karte steuerung">
        <h2>Turnier <span id="verbindung" class="punkt" title="Verbindung zum Server"></span></h2>
        <label class="haken"><input id="opt-waffen" type="checkbox"> Alle Waffen aktivieren</label>
        <div class="zeile">
          <label class="haken"><input id="opt-wind" type="checkbox"> Wind</label>
          <label class="haken"><input id="opt-wetter" type="checkbox"> Wetter</label>
        </div>
        <label>Einteilung
          <select id="opt-modus">
            <option value="auto">Automatisch</option>
            <option value="direktfinale">Direkt ins Finale (bis 8)</option>
            <option value="qualifying">Mit Qualifying</option>
          </select>
        </label>
        <button id="start">Turnier starten</button>
        <div class="zeile">
          <button id="sperre" class="leise">Raum sperren</button>
          <button id="aufraeumen" class="leise">Getrennte entfernen</button>
        </div>
        <div class="zeile">
          <button id="neuer-raum" class="leise">Neuer Raum</button>
          <button class="leise" data-vollbild>⛶ Vollbild</button>
        </div>
        <p class="tipp">Kachel antippen, um jemanden aus dem Raum zu nehmen.</p>
      </section>
    </aside>
    <main class="hauptbereich">
      <section class="karte uebersicht">
        <div><div class="zahl" id="anzahl">0</div><div class="einheit">Handys verbunden</div></div>
        <div class="plan" id="plan"></div>
        <img class="schullogo" src="/img/schullogo.png" alt="Logo der Schule">
      </section>
      <div class="meldung" hidden></div>
      <div id="spielerliste" class="kacheln"></div>
    </main>
  </div>

  <!-- Qualifying -->
  <div id="ansicht-quali" class="turnier-ansicht" hidden>
    <header class="turnier-kopf">
      <h1>Qualifying</h1>
      <p id="quali-stand"></p>
      <div class="knoepfe">
        <button id="finale-start" disabled>Finale starten</button>
        <button class="leise" data-vollbild>⛶ Vollbild</button>
        <button class="leise abbrechen">Abbrechen</button>
      </div>
    </header>
    <div class="meldung" hidden></div>
    <div id="finalisten" class="finalisten"></div>
    <div id="gruppen" class="gruppen"></div>
  </div>

  <!-- Finale -->
  <div id="ansicht-finale" class="finale-ansicht" hidden>
    <canvas id="finale" width="384" height="216" aria-label="Finale"></canvas>
    <div class="finale-titel">Finale</div>
    <div id="finale-hinweis" class="ende-anzeige" hidden>
      <div class="pokal" aria-hidden="true">🎯</div>
      <p>Finale!</p>
      <small id="finale-namen"></small>
    </div>
    <button class="leise abbrechen finale-abbrechen">Abbrechen</button>
  </div>

  <!-- Siegerehrung -->
  <div id="ansicht-sieger" class="sieger-ansicht" hidden>
    <div id="konfetti" class="konfetti" aria-hidden="true"></div>
    <div class="pokal-gross" aria-hidden="true">🏆</div>
    <p class="sieger-titel">Turniersieger</p>
    <p id="sieger-name" class="sieger-name"></p>
    <button id="neues-turnier">Neues Turnier</button>
  </div>

  <script type="module" src="/js/beamer.js"></script>
</body>
</html>
